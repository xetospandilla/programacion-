<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Listas</title>
    </head>
    <body>
        <!--Listas no ordenadas-->
        <h1>Página web con Listas</h1>
        <h2>Lista desordenada</h2>
        <ul>
            <li>Elemento de lista 1</li> <!--Los "li" son elementos de listas-->
            <li>Elemento de lista 2</li>
            <li>Elemento de lista 3</li>
        </ul>
        <h2>Lista ordenada</h2>
        <!--Listas ordenadas-->
        <ol>
            <li>Elemento de lista 1</li>
            <li>Elemento de lista 2</li>
            <li>Elemento de lista 3</li>
        </ol>
        <p><button><a href="../index.html">Página de Inicio</a></button></p>
    </body>
</html>
